<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Chargebox Logo with modern EV styling -->
  <defs>
    <linearGradient id="cb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="cb-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  
  <!-- Icon Symbol: Rounded Charging Station with Lightning Bolt -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#cb-box)" stroke="#334155" stroke-width="1.5" />
    <!-- Glowing ring -->
    <circle cx="26" cy="26" r="19" stroke="url(#cb-grad)" stroke-width="2" stroke-dasharray="80 30" opacity="0.9" />
    <!-- EV Plug & Bolt -->
    <path d="M28 14L19 27H27L24 38L34 24H26L28 14Z" fill="url(#cb-grad)" />
    <!-- LED status dot -->
    <circle cx="43" cy="11" r="3" fill="#00D26A" />
  </g>

  <!-- Typography -->
  <text x="70" y="37" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="-0.5">
    CHARGE<tspan fill="url(#cb-grad)">BOX</tspan>
  </text>
  
  <text x="71" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#64748B" letter-spacing="2.5">
    MOBILITÉ ÉLECTRIQUE &amp; IRVE
  </text>
</svg>
